# Builds the Windows installer on a real Windows machine, installs it the way
# a user would, then runs scripts/e2e.mjs against the installed app.
# Start it from the Actions tab (or `gh workflow run windows-test.yml`).
name: Windows test

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Download yt-dlp and FFmpeg for Windows
        shell: bash
        run: bash scripts/fetch-binaries.sh win

      - name: Build installer
        run: |
          npx electron-vite build
          npx electron-builder --win --x64 --publish never

      - name: Install (silently, like double-clicking it)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*Setup*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'MNP Media Downloader.exe' | Select-Object -First 1
          if (-not $exe) { throw 'App not found after installing' }
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Installed to $($exe.FullName)"

      - name: Test the installed app
        shell: pwsh
        run: |
          npm i --no-save playwright-core@1.56.1
          node scripts/e2e.mjs "$env:APP_EXE" e2e-out

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-out/*.png
            e2e-out/results.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe
          retention-days: 14
